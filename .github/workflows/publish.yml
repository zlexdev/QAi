name: Publish

# The filename is registered with PyPI's trusted publisher — renaming this file breaks
# the OIDC match and every publish is rejected until the publisher is updated too.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Same browser suite as ci.yml — see the note there on why 20 was too tight.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev --extra demo --extra api --extra apispec --extra mcp

      # A published version is permanent — PyPI does not allow re-uploading one. Run
      # the whole gate here, against the tagged commit, not just whatever CI last saw.
      - run: uv run ruff check .
      - run: uv run mypy qai
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC trusted publishing — the auth is this claim plus the publisher registered
      # on pypi.org. No API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # Deliberately after publish: a GitHub Release announcing a version that PyPI
  # rejected would point at an install command that does not work.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
