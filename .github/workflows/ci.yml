name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need a browser, so a typo or a type error comes back in
  # ~4 minutes instead of waiting out the 30-minute Chromium suite below.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev --extra demo --extra api --extra apispec --extra mcp

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy qai

      # No Chromium install here — that is the point. A test that needs one is marked
      # `browser` automatically (tests/conftest.py) and runs in the job below.
      - name: Tests (no browser)
        run: uv run pytest -q -m "not browser"

  browser:
    runs-on: ubuntu-latest
    # Drives a real browser against the demo target; ~30 min. A tighter cap cancels it
    # mid-run, which reads as a failure nobody can reproduce locally.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev --extra demo --extra api --extra apispec --extra mcp

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Tests (browser)
        run: uv run pytest -q -m browser

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The CLI is free; gitleaks-action needs a paid license on org repos.
      - name: Scan working tree
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --config /repo/.gitleaks.toml
          --no-git --redact --no-banner
