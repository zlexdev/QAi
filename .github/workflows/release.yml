name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Same browser suite as ci.yml — see the note there on why 20 was too tight.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev --extra demo --extra api --extra apispec --extra mcp

      # A tag must not ship what master wouldn't — same gate as ci.yml, re-run here
      # because a tag can point at any commit, including one CI never saw.
      - run: uv run ruff check .
      - run: uv run mypy qai
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
